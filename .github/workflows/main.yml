
name: Build Prime One Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build PRIME ONE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Apply Android permissions
        run: node android-config/apply-permissions.mjs

      - name: Apply app icon
        run: node android-config/apply-icon.mjs

      - name: Configure Picture-in-Picture
        run: node android-config/apply-pip.mjs

      - name: Configure media scanner and lock screen
        run: node android-config/apply-local-media.mjs

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload PRIME ONE APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-ONE-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
